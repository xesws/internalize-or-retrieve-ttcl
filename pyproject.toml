[project]
name = "ttcl"
version = "0.1.0"
description = "Internalize or Retrieve: online memory placement for test-time continual learning agents"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
gpu = [
    "transformers>=4.43",
    "accelerate>=0.30",
]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
